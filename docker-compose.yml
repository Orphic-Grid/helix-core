services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: helixcore
      POSTGRES_USER: helix
      POSTGRES_PASSWORD: helix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helix -d helixcore"]
      interval: 5s
      timeout: 5s
      retries: 10

  intelligence:
    build:
      context: ./services/intelligence
    ports:
      - "8000:8000"

  api:
    build:
      context: ./apps/api
    environment:
      PORT: 4000
      DATABASE_URL: postgres://helix:helix@postgres:5432/helixcore
      JWT_SECRET: local-dev-change-me
      JWT_REFRESH_SECRET: local-dev-refresh-secret
      INTELLIGENCE_URL: http://intelligence:8000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      intelligence:
        condition: service_started

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
